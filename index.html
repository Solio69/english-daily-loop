<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English daily loop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      /* Keep this early theme bootstrap in sync with src/context/ThemeContext.tsx. */
      (function () {
        var storageKey = "english-daily-loop-theme-preference";
        var preference = "system";

        try {
          var storedPreference = window.localStorage.getItem(storageKey);
          if (
            storedPreference === "system" ||
            storedPreference === "light" ||
            storedPreference === "dark"
          ) {
            preference = storedPreference;
          }
        } catch (error) {
          preference = "system";
        }

        function getTelegramTheme() {
          try {
            var webApp = window.Telegram && window.Telegram.WebApp;
            var colorScheme = webApp && webApp.colorScheme;
            return colorScheme === "dark" || colorScheme === "light"
              ? colorScheme
              : null;
          } catch (error) {
            return null;
          }
        }

        function getBrowserTheme() {
          try {
            return window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } catch (error) {
            return "light";
          }
        }

        var theme =
          preference === "system"
            ? getTelegramTheme() || getBrowserTheme()
            : preference;

        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor =
          theme === "dark" ? "#061326" : "#eaf4ff";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
